<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 01: Trang thơ Bốn mùa</title>
    <style>
        :root {
            --mau-nen-khung: #FFFDE7;
            --mau-vien-khung: #9E9E9E;
            --mau-nen-tieu-de: #FFD9E6;
            --mau-do: #D40000;
            --mau-xanh: #0033CC;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Times New Roman", Times, serif;
            box-sizing: border-box;
        }

        .khung-tho {
            width: 640px;
            max-width: 100%;
            background-color: var(--mau-nen-khung);
            border: 1px solid var(--mau-vien-khung);
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--mau-do);
            background-color: var(--mau-nen-tieu-de);
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 6px 0;
            margin: 0 0 20px 0;
        }

        p {
            font-style: italic;
            line-height: 1.7;
            font-size: 17px;
            margin: 14px 0;
        }

        .kho-xanh {
            color: var(--mau-xanh);
        }

        .kho-do {
            color: var(--mau-do);
        }

        hr {
            width: 55%;
            border: none;
            border-top: 1px solid var(--mau-xanh);
            margin: 16px auto;
        }
    </style>
</head>
<body>

    <article class="khung-tho">
        <h1>BỐN MÙA</h1>

        <p class="kho-xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p class="kho-xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>

</body>
</html>
